<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Blog Preview Card</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/main.css" />
    <style></style>
  </head>
  <body>
    <!-- Main Content -->
    <main>
      <article class="card">
        <img
          class="card__image"
          src="assets/images/illustration-article.svg"
          alt=""
        />
        <div class="card__content">
          <span class="card__badge">Learning</span>
          <time class="card__date" datetime="2023-12-21"
            >Published 21 Dec 2023</time
          >
          <h1><a class="card__title" href="#">HTML & CSS foundations</a></h1>
          <p class="card__description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
          <div class="card__author">
            <img
              class="author__avatar"
              src="assets/images/image-avatar.webp"
              alt="Avatar of Greg Hooper."
            />
            <span class="author__name">Greg Hooper</span>
          </div>
        </div>
      </article>
    </main>

    <!-- Attribution -->
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=3">Frontend Mentor</a>. Coded
      by <a href="https://antoneladiana.github.io/">Antonela Diana</a>.
    </footer>
  </body>
</html>
